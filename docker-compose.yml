services:
  ollama:
    image: ollama/ollama:latest
    container_name: chimera-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.4.15
    container_name: chimera-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  chat-ui:
    image: appkademiya/acaisp-chimera-ui:latest
    container_name: chimera-ui
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_CHAT_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=qwen2.5:1.5b
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - ollama
      - chromadb
    restart: always

volumes:
  ollama_data:
  chroma_data:
